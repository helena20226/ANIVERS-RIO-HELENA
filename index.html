<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lista de Presentes 🎁</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 10px;
      width: 200px;
      margin: 15px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    img {
      width: 100%;
      border-radius: 10px;
    }
    a {
      display: block;
      margin-top: 10px;
      background: #ff69b4;
      color: white;
      padding: 8px;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h1>🎉 Minha Lista de Presentes 🎉</h1>

<div class="container" id="lista"></div>

<script>
const presentes = [
  {
    titulo: "Perfume",
    imagem: "https://via.placeholder.com/200",
    link: "https://google.com"
  }
];

const lista = document.getElementById("lista");

presentes.forEach(item => {
  lista.innerHTML += `
    <div class="card">
      <h3>${item.titulo}</h3>
      <img src="${item.imagem}">
      <a href="${item.link}" target="_blank">Ver presente</a>
    </div>
  `;
});
</script>

</body>
</html>
